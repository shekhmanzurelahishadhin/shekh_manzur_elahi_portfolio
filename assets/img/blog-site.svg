<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">Illustration of a blog platform with a post editor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0b4f"/>
      <stop offset="0.55" stop-color="#5a1a8f"/>
      <stop offset="1" stop-color="#d0457f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#ffb3c9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffb3c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="img1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a55ff"/><stop offset="1" stop-color="#d0457f"/>
    </linearGradient>
    <linearGradient id="img2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a39a"/><stop offset="1" stop-color="#5138f2"/>
    </linearGradient>
    <linearGradient id="img3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#e5506b"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#14052a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- browser window -->
  <g filter="url(#sh)"><rect x="50" y="60" width="560" height="470" rx="20" fill="#ffffff"/></g>
  <path d="M70 60h520a20 20 0 0 1 20 20v18H50V80a20 20 0 0 1 20-20z" fill="#f3f0f8"/>
  <circle cx="74" cy="79" r="5" fill="#ff6b8b"/><circle cx="90" cy="79" r="5" fill="#ffc861"/><circle cx="106" cy="79" r="5" fill="#45d49b"/>
  <rect x="230" y="72" width="200" height="14" rx="7" fill="#e4dff0"/>

  <!-- blog header -->
  <g font-family="Poppins, Arial, sans-serif">
    <text x="74" y="134" font-size="17" font-weight="700" fill="#2a0b4f">the<tspan fill="#d0457f">.</tspan>blog</text>
    <g font-size="10.5" fill="#6b5a80"><text x="300" y="132">Latest</text><text x="346" y="132">Tech</text><text x="384" y="132">Design</text><text x="432" y="132">Life</text></g>
    <rect x="510" y="116" width="76" height="24" rx="12" fill="#2a0b4f"/>
    <text x="548" y="132" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Write</text>
  </g>

  <!-- featured post -->
  <rect x="74" y="156" width="512" height="160" rx="14" fill="url(#img1)"/>
  <g fill="#ffffff" fill-opacity="0.18">
    <circle cx="520" cy="196" r="46"/><path d="M74 286l90-60 70 46 60-34 110 78H88a14 14 0 0 1-14-14z"/>
  </g>
  <rect x="94" y="176" width="64" height="20" rx="10" fill="#ffffff" fill-opacity="0.9"/>
  <text x="126" y="190" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#5a1a8f">Featured</text>
  <rect x="94" y="252" width="250" height="13" rx="6.5" fill="#ffffff"/>
  <rect x="94" y="274" width="180" height="13" rx="6.5" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="102" cy="300" r="8" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="116" y="296" width="80" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.6"/>

  <!-- post cards -->
  <g>
    <rect x="74" y="332" width="160" height="178" rx="14" fill="#f7f5fb"/>
    <rect x="250" y="332" width="160" height="178" rx="14" fill="#f7f5fb"/>
    <rect x="426" y="332" width="160" height="178" rx="14" fill="#f7f5fb"/>
    <rect x="84" y="342" width="140" height="80" rx="10" fill="url(#img2)"/>
    <rect x="260" y="342" width="140" height="80" rx="10" fill="url(#img3)"/>
    <rect x="436" y="342" width="140" height="80" rx="10" fill="url(#img1)"/>
    <g fill="#ffffff" fill-opacity="0.25">
      <path d="M84 410l40-26 30 18 26-14 44 34v0a10 10 0 0 1-10 10H94a10 10 0 0 1-10-10z"/>
      <circle cx="356" cy="370" r="16"/>
      <path d="M436 412l46-30 36 22 58-30v38a10 10 0 0 1-10 10H446a10 10 0 0 1-10-10z"/>
    </g>
  </g>
  <g font-family="Poppins, Arial, sans-serif" font-size="8.5" font-weight="600">
    <rect x="84" y="432" width="44" height="16" rx="8" fill="#16a39a" fill-opacity="0.15"/><text x="106" y="443" text-anchor="middle" fill="#0b6e7a">Tech</text>
    <rect x="260" y="432" width="50" height="16" rx="8" fill="#e5506b" fill-opacity="0.15"/><text x="285" y="443" text-anchor="middle" fill="#b8324d">Design</text>
    <rect x="436" y="432" width="38" height="16" rx="8" fill="#6a55ff" fill-opacity="0.15"/><text x="455" y="443" text-anchor="middle" fill="#5138f2">Life</text>
  </g>
  <g fill="#2a0b4f">
    <rect x="84" y="458" width="132" height="9" rx="4.5" fill-opacity="0.75"/><rect x="84" y="474" width="100" height="9" rx="4.5" fill-opacity="0.75"/>
    <rect x="84" y="492" width="70" height="6" rx="3" fill-opacity="0.2"/>
    <rect x="260" y="458" width="126" height="9" rx="4.5" fill-opacity="0.75"/><rect x="260" y="474" width="110" height="9" rx="4.5" fill-opacity="0.75"/>
    <rect x="260" y="492" width="70" height="6" rx="3" fill-opacity="0.2"/>
    <rect x="436" y="458" width="134" height="9" rx="4.5" fill-opacity="0.75"/><rect x="436" y="474" width="92" height="9" rx="4.5" fill-opacity="0.75"/>
    <rect x="436" y="492" width="70" height="6" rx="3" fill-opacity="0.2"/>
  </g>

  <!-- editor panel -->
  <g filter="url(#sh)"><rect x="500" y="150" width="262" height="322" rx="18" fill="#1d0b38"/></g>
  <rect x="500" y="150" width="262" height="322" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <g font-family="Poppins, Arial, sans-serif">
    <text x="520" y="180" font-size="12.5" font-weight="700" fill="#ffffff">New Post</text>
    <rect x="690" y="166" width="54" height="20" rx="10" fill="#45d49b" fill-opacity="0.18"/>
    <text x="717" y="180" text-anchor="middle" font-size="9" font-weight="600" fill="#45d49b">Draft</text>

    <text x="520" y="206" font-size="9" fill="#b7a6d6">Title</text>
    <rect x="520" y="212" width="222" height="26" rx="8" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="530" y="222" width="140" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.8"/>

    <text x="520" y="256" font-size="9" fill="#b7a6d6">Cover image</text>
    <rect x="520" y="262" width="222" height="58" rx="10" fill="none" stroke="#b7a6d6" stroke-opacity="0.5" stroke-dasharray="5 4"/>
    <path d="M622 298v-16M614 289l8-8 8 8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="602" y="304" width="40" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.35"/>

    <text x="520" y="338" font-size="9" fill="#b7a6d6">Category</text>
    <rect x="520" y="344" width="50" height="20" rx="10" fill="#d0457f"/><text x="545" y="358" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Tech</text>
    <rect x="576" y="344" width="54" height="20" rx="10" fill="#ffffff" fill-opacity="0.08"/><text x="603" y="358" text-anchor="middle" font-size="9" fill="#d9cdee">Design</text>
    <rect x="636" y="344" width="40" height="20" rx="10" fill="#ffffff" fill-opacity="0.08"/><text x="656" y="358" text-anchor="middle" font-size="9" fill="#d9cdee">Life</text>

    <text x="520" y="384" font-size="9" fill="#b7a6d6">SEO meta</text>
    <rect x="520" y="390" width="222" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="520" y="403" width="170" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.22"/>

    <rect x="520" y="424" width="222" height="32" rx="10" fill="url(#img1)"/>
    <text x="631" y="444" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Publish</text>
  </g>

  <!-- floating API chip -->
  <g filter="url(#sh)"><rect x="560" y="496" width="200" height="50" rx="25" fill="#ffffff"/></g>
  <rect x="574" y="509" width="44" height="24" rx="12" fill="#45d49b" fill-opacity="0.18"/>
  <text x="596" y="525" text-anchor="middle" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#14855c">POST</text>
  <text x="628" y="525" font-family="Consolas, monospace" font-size="11" fill="#2a0b4f">/api/posts</text>
  <text x="736" y="525" text-anchor="end" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#14855c">201</text>
</svg>
