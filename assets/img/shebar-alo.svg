<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">Illustration of a clinic website with appointment booking</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#063b4a"/>
      <stop offset="0.6" stop-color="#0b6e7a"/>
      <stop offset="1" stop-color="#16a39a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#7ff0d8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7ff0d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7fbf7"/>
      <stop offset="1" stop-color="#cdf3ec"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#021f27" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <g fill="#ffffff" fill-opacity="0.06">
    <path d="M690 40h16v16h16v16h-16v16h-16V72h-16V56h16z"/>
    <path d="M40 520h12v12h12v12H52v12H40v-12H28v-12h12z"/>
  </g>

  <!-- browser window -->
  <g filter="url(#sh)"><rect x="60" y="62" width="680" height="476" rx="20" fill="#ffffff"/></g>
  <path d="M80 62h640a20 20 0 0 1 20 20v18H60V82a20 20 0 0 1 20-20z" fill="#eef4f5"/>
  <circle cx="84" cy="81" r="5" fill="#ff6b8b"/><circle cx="100" cy="81" r="5" fill="#ffc861"/><circle cx="116" cy="81" r="5" fill="#45d49b"/>
  <rect x="290" y="74" width="220" height="14" rx="7" fill="#dbe6e8"/>

  <!-- site nav -->
  <g font-family="Poppins, Arial, sans-serif">
    <rect x="84" y="116" width="26" height="26" rx="8" fill="#0fa39a"/>
    <path d="M93 129h8M97 125v8" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="118" y="134" font-size="13" font-weight="700" fill="#063b4a">Shebar Alo</text>
    <g font-size="11" fill="#4c6b72">
      <text x="380" y="133">Home</text><text x="428" y="133">Doctors</text>
      <text x="486" y="133">Services</text><text x="548" y="133">Contact</text>
    </g>
    <rect x="618" y="117" width="98" height="26" rx="13" fill="#0fa39a"/>
    <text x="667" y="134" text-anchor="middle" font-size="10.5" font-weight="600" fill="#fff">Appointment</text>
  </g>

  <!-- hero band -->
  <rect x="76" y="156" width="648" height="196" rx="16" fill="url(#hero)"/>
  <g font-family="Poppins, Arial, sans-serif">
    <rect x="100" y="180" width="110" height="20" rx="10" fill="#0fa39a" fill-opacity="0.15"/>
    <text x="155" y="194" text-anchor="middle" font-size="10" font-weight="600" fill="#0b6e7a">Trusted care</text>
    <text x="100" y="230" font-size="24" font-weight="700" fill="#063b4a">Your health,</text>
    <text x="100" y="260" font-size="24" font-weight="700" fill="#063b4a">our priority</text>
  </g>
  <rect x="100" y="276" width="190" height="8" rx="4" fill="#063b4a" fill-opacity="0.2"/>
  <rect x="100" y="292" width="150" height="8" rx="4" fill="#063b4a" fill-opacity="0.2"/>
  <rect x="100" y="314" width="96" height="24" rx="12" fill="#063b4a"/>
  <rect x="204" y="314" width="86" height="24" rx="12" fill="none" stroke="#063b4a" stroke-opacity="0.4"/>

  <!-- doctor figure -->
  <circle cx="380" cy="262" r="78" fill="#0fa39a" fill-opacity="0.18"/>
  <path d="M322 352c4-44 28-62 58-62s54 18 58 62z" fill="#ffffff"/>
  <path d="M368 292l12 26 12-26" fill="none" stroke="#0fa39a" stroke-width="3"/>
  <path d="M358 300c-6 14-6 26 2 34" fill="none" stroke="#063b4a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="361" cy="337" r="5" fill="none" stroke="#063b4a" stroke-width="3"/>
  <rect x="371" y="270" width="18" height="22" rx="6" fill="#d9a07a"/>
  <circle cx="380" cy="246" r="28" fill="#e2ad86"/>
  <path d="M352 244c0-20 13-30 28-30s28 10 28 30c-6-10-16-14-28-14s-22 4-28 14z" fill="#2b2b3b"/>
  <rect x="396" y="314" width="18" height="12" rx="3" fill="#0fa39a"/>

  <!-- booking card -->
  <g filter="url(#sh)"><rect x="478" y="174" width="226" height="226" rx="16" fill="#ffffff"/></g>
  <g font-family="Poppins, Arial, sans-serif">
    <text x="498" y="204" font-size="13" font-weight="700" fill="#063b4a">Book an Appointment</text>
    <text x="498" y="226" font-size="9.5" fill="#6b8a90">Department</text>
    <rect x="498" y="232" width="186" height="24" rx="8" fill="#f1f7f8" stroke="#dbe6e8"/>
    <rect x="508" y="241" width="70" height="6" rx="3" fill="#063b4a" fill-opacity="0.35"/>
    <path d="M668 242l4 4 4-4" fill="none" stroke="#6b8a90" stroke-width="1.6"/>
    <text x="498" y="274" font-size="9.5" fill="#6b8a90">Choose a slot</text>
  </g>
  <g font-family="Poppins, Arial, sans-serif" font-size="9" text-anchor="middle">
    <rect x="498" y="281" width="56" height="22" rx="8" fill="#f1f7f8"/><text x="526" y="295" fill="#4c6b72">09:00</text>
    <rect x="563" y="281" width="56" height="22" rx="8" fill="#0fa39a"/><text x="591" y="295" fill="#fff" font-weight="600">10:30</text>
    <rect x="628" y="281" width="56" height="22" rx="8" fill="#f1f7f8"/><text x="656" y="295" fill="#4c6b72">12:00</text>
    <rect x="498" y="310" width="56" height="22" rx="8" fill="#f1f7f8"/><text x="526" y="324" fill="#4c6b72">15:00</text>
    <rect x="563" y="310" width="56" height="22" rx="8" fill="#f1f7f8"/><text x="591" y="324" fill="#4c6b72">16:30</text>
    <rect x="628" y="310" width="56" height="22" rx="8" fill="#f1f7f8" fill-opacity="0.6"/><text x="656" y="324" fill="#b3c4c7">18:00</text>
    <rect x="498" y="348" width="186" height="32" rx="10" fill="#063b4a"/>
    <text x="591" y="368" fill="#fff" font-size="11" font-weight="600">Confirm Booking</text>
  </g>

  <!-- services row -->
  <g>
    <rect x="76" y="370" width="152" height="146" rx="14" fill="#f4f9fa"/>
    <rect x="240" y="370" width="152" height="146" rx="14" fill="#f4f9fa"/>
    <rect x="404" y="370" width="152" height="146" rx="14" fill="#f4f9fa"/>
    <rect x="568" y="420" width="156" height="96" rx="14" fill="#f4f9fa"/>
  </g>
  <g fill="none" stroke="#0fa39a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- heart pulse -->
    <rect x="94" y="388" width="40" height="40" rx="12" fill="#0fa39a" fill-opacity="0.12" stroke="none"/>
    <path d="M100 408h7l4-8 6 16 4-8h7"/>
    <!-- stethoscope -->
    <rect x="258" y="388" width="40" height="40" rx="12" fill="#0fa39a" fill-opacity="0.12" stroke="none"/>
    <path d="M268 396v8a8 8 0 0 0 16 0v-8M276 412v6a6 6 0 0 0 12 0v-3"/><circle cx="288" cy="413" r="2.5"/>
    <!-- pill -->
    <rect x="422" y="388" width="40" height="40" rx="12" fill="#0fa39a" fill-opacity="0.12" stroke="none"/>
    <rect x="431" y="403" width="22" height="10" rx="5" transform="rotate(-35 442 408)"/><path d="M439 412l6-8"/>
  </g>
  <g font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" fill="#063b4a">
    <text x="94" y="452">Cardiology</text><text x="258" y="452">General Care</text><text x="422" y="452">Pharmacy</text>
  </g>
  <g fill="#063b4a" fill-opacity="0.18">
    <rect x="94" y="464" width="112" height="7" rx="3.5"/><rect x="94" y="478" width="84" height="7" rx="3.5"/>
    <rect x="258" y="464" width="112" height="7" rx="3.5"/><rect x="258" y="478" width="90" height="7" rx="3.5"/>
    <rect x="422" y="464" width="112" height="7" rx="3.5"/><rect x="422" y="478" width="76" height="7" rx="3.5"/>
  </g>
  <!-- doctor avatars strip -->
  <g>
    <circle cx="598" cy="452" r="15" fill="#e2ad86"/><circle cx="624" cy="452" r="15" fill="#c98f6c" stroke="#f4f9fa" stroke-width="3"/><circle cx="650" cy="452" r="15" fill="#f0c3a0" stroke="#f4f9fa" stroke-width="3"/>
    <circle cx="676" cy="452" r="15" fill="#0fa39a" stroke="#f4f9fa" stroke-width="3"/>
    <path d="M670 452h12M676 446v12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="584" y="480" width="110" height="7" rx="3.5" fill="#063b4a" fill-opacity="0.3"/>
    <rect x="584" y="494" width="76" height="7" rx="3.5" fill="#063b4a" fill-opacity="0.15"/>
  </g>

  <!-- floating confirmation -->
  <g filter="url(#sh)"><rect x="590" y="514" width="180" height="56" rx="28" fill="#063b4a"/></g>
  <circle cx="619" cy="542" r="16" fill="#45d49b"/>
  <path d="M611 542l6 6 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="644" y="539" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" fill="#fff">Booking confirmed</text>
  <rect x="644" y="548" width="80" height="6" rx="3" fill="#ffffff" fill-opacity="0.35"/>
</svg>
